name: Android release package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - stable

permissions:
  actions: read
  contents: write

env:
  GRADLE_VERSION: '8.13'

jobs:
  package:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"

      - name: Install Gradle
        run: |
          curl --fail --silent --show-error --location "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag is validated on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --no-tags origin main
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test -n "$release_commit"
          git merge-base --is-ancestor "$release_commit" origin/main
          ci_run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-ci.yml --commit "$release_commit" --limit 20 --json databaseId,status,conclusion,event,headBranch --jq 'map(select(.status == "completed" and .conclusion == "success" and .event == "push" and .headBranch == "main")) | .[0].databaseId // empty')"
          test -n "$ci_run_id"
          ci_jobs="$(gh run view "$ci_run_id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name == "validate" or .name == "instrumented") | .conclusion] | sort | join(",")')"
          test "$ci_jobs" = "success,success"

      - name: Prepare release version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REQUESTED_CHANNEL: ${{ inputs.channel || '' }}
          THORTOOLS_KEYSTORE_BASE64: ${{ secrets.THORTOOLS_KEYSTORE_BASE64 }}
          THORTOOLS_KEYSTORE_PASSWORD: ${{ secrets.THORTOOLS_KEYSTORE_PASSWORD }}
          THORTOOLS_KEY_ALIAS: ${{ secrets.THORTOOLS_KEY_ALIAS }}
          THORTOOLS_KEY_PASSWORD: ${{ secrets.THORTOOLS_KEY_PASSWORD }}
          THORTOOLS_ALPHA_KEYSTORE_BASE64: ${{ secrets.THORTOOLS_ALPHA_KEYSTORE_BASE64 }}
          THORTOOLS_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.THORTOOLS_ALPHA_KEYSTORE_PASSWORD }}
          THORTOOLS_ALPHA_KEY_ALIAS: ${{ secrets.THORTOOLS_ALPHA_KEY_ALIAS }}
          THORTOOLS_ALPHA_KEY_PASSWORD: ${{ secrets.THORTOOLS_ALPHA_KEY_PASSWORD }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)\.([1-9][0-9]*))?$ ]] || exit 1
          release_version="${RELEASE_TAG#v}"
          numeric_version="${release_version%%-*}"
          IFS=. read -r major minor patch <<EOF
          $numeric_version
          EOF
          case "$major:$minor:$patch" in
            *[!0-9:]*|*::*|:*|*:) exit 1 ;;
          esac
          test "$minor" -le 999
          test "$patch" -le 999
          release_suffix="${release_version#"$numeric_version"}"
          prerelease_number=0
          case "$release_suffix" in
            "") inferred_channel=stable ;;
            -alpha.*) inferred_channel=alpha; prerelease_number="${release_suffix#-alpha.}" ;;
            -beta.*) inferred_channel=beta; prerelease_number="${release_suffix#-beta.}" ;;
            *) exit 1 ;;
          esac
          if [[ -n "$release_suffix" ]]; then
            case "$prerelease_number" in
              ''|*[!0-9]*) exit 1 ;;
            esac
            test "$prerelease_number" -ge 1
            test "$prerelease_number" -le 999
          fi
          case "$inferred_channel" in
            alpha) qualifier_rank="$prerelease_number" ;;
            beta) qualifier_rank=$((1000 + prerelease_number)) ;;
            stable) qualifier_rank=2000 ;;
          esac
          release_code=$((major * 10000000 + minor * 10000 + patch * 1000 + qualifier_rank))
          test "$release_code" -gt 0
          test "$release_code" -le 2147483647
          echo "THORTOOLS_VERSION_NAME=$release_version" >> "$GITHUB_ENV"
          echo "THORTOOLS_VERSION_CODE=$release_code" >> "$GITHUB_ENV"
          release_channel="${REQUESTED_CHANNEL:-$inferred_channel}"
          case "$release_channel" in
            alpha|beta|stable) ;;
            *) exit 1 ;;
          esac
          case "$release_channel:$inferred_channel" in
            alpha:alpha|beta:beta|stable:stable) ;;
            *) exit 1 ;;
          esac
          build_type=release
          alpha_signing=false
          if [[ "$release_channel" == "alpha" ]]; then
            build_type=alpha
            if [[ -n "$THORTOOLS_ALPHA_KEYSTORE_BASE64" && -n "$THORTOOLS_ALPHA_KEYSTORE_PASSWORD" && -n "$THORTOOLS_ALPHA_KEY_ALIAS" && -n "$THORTOOLS_ALPHA_KEY_PASSWORD" ]]; then
              keystore_path="$RUNNER_TEMP/thortools-alpha.jks"
              printf '%s' "$THORTOOLS_ALPHA_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore_path"
              test -s "$keystore_path"
              echo "THORTOOLS_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
              echo "THORTOOLS_KEYSTORE_PASSWORD=$THORTOOLS_ALPHA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
              echo "THORTOOLS_KEY_ALIAS=$THORTOOLS_ALPHA_KEY_ALIAS" >> "$GITHUB_ENV"
              echo "THORTOOLS_KEY_PASSWORD=$THORTOOLS_ALPHA_KEY_PASSWORD" >> "$GITHUB_ENV"
              alpha_signing=true
            fi
          else
            test -n "$THORTOOLS_KEYSTORE_BASE64"
            test -n "$THORTOOLS_KEYSTORE_PASSWORD"
            test -n "$THORTOOLS_KEY_ALIAS"
            test -n "$THORTOOLS_KEY_PASSWORD"
            keystore_path="$RUNNER_TEMP/thortools-release.jks"
            printf '%s' "$THORTOOLS_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            echo "THORTOOLS_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          fi
          if [[ "$release_channel" == "stable" ]]; then
            prerelease=false
          else
            prerelease=true
          fi
          echo "channel=$release_channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          echo "alpha_signing=$alpha_signing" >> "$GITHUB_OUTPUT"

      - name: Build alpha APK
        if: steps.release.outputs.channel == 'alpha'
        run: gradle --no-daemon --stacktrace assembleAlpha

      - name: Build signed release APK
        if: steps.release.outputs.channel != 'alpha'
        env:
          THORTOOLS_KEYSTORE_PASSWORD: ${{ secrets.THORTOOLS_KEYSTORE_PASSWORD }}
          THORTOOLS_KEY_ALIAS: ${{ secrets.THORTOOLS_KEY_ALIAS }}
          THORTOOLS_KEY_PASSWORD: ${{ secrets.THORTOOLS_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify alpha APK
        if: steps.release.outputs.channel == 'alpha'
        run: |
          release_apk="$(find app/build/outputs/apk/alpha -type f -name 'thortools-*.apk' -print -quit)"
          test -n "$release_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$release_apk"
          if [[ "${{ steps.release.outputs.alpha_signing }}" == "true" ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$release_apk" | grep -Fq 'CN=ThorTools Alpha'
          else
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$release_apk" | grep -Fq 'CN=Android Debug'
          fi
          package_info="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$release_apk")"
          package_name="$(printf '%s\n' "$package_info" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test "$package_name" = "dev.adrian.thortools"
          printf '%s\n' "$package_info" | grep -Fq "versionCode='$THORTOOLS_VERSION_CODE'"
          printf '%s\n' "$package_info" | grep -Fq "versionName='$THORTOOLS_VERSION_NAME'"

      - name: Verify signed release APK
        if: steps.release.outputs.channel != 'alpha'
        run: |
          release_apk="$(find app/build/outputs/apk/release -type f -name 'thortools-*.apk' -print -quit)"
          test -n "$release_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$release_apk"
          package_info="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$release_apk")"
          package_name="$(printf '%s\n' "$package_info" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test "$package_name" = "dev.adrian.thortools"
          printf '%s\n' "$package_info" | grep -Fq "versionCode='$THORTOOLS_VERSION_CODE'"
          printf '%s\n' "$package_info" | grep -Fq "versionName='$THORTOOLS_VERSION_NAME'"

      - name: Stage Obtainium APK
        id: apk
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUILD_TYPE: ${{ steps.release.outputs.build_type }}
        run: |
          apk_name="thortools-${RELEASE_TAG}.apk"
          release_apk="$(find "app/build/outputs/apk/$BUILD_TYPE" -type f -name 'thortools-*.apk' -print -quit)"
          test -n "$release_apk"
          cp "$release_apk" "$RUNNER_TEMP/$apk_name"
          (cd "$RUNNER_TEMP" && sha256sum "$apk_name") > "$RUNNER_TEMP/$apk_name.sha256"
          echo "path=$RUNNER_TEMP/$apk_name" >> "$GITHUB_OUTPUT"
          echo "checksum=$RUNNER_TEMP/$apk_name.sha256" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          previous_tag=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$RELEASE_TAG" == "${GITHUB_REF_NAME:-}" ]]; then
            previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)"
          else
            previous_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
            if [[ "$previous_tag" == "$RELEASE_TAG" ]]; then
              previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)"
            fi
          fi
          notes_path="$RUNNER_TEMP/thortools-release-notes.md"
          features_path="$RUNNER_TEMP/thortools-release-features.md"
          fixes_path="$RUNNER_TEMP/thortools-release-fixes.md"
          other_path="$RUNNER_TEMP/thortools-release-other.md"
          : > "$features_path"
          : > "$fixes_path"
          : > "$other_path"
          commit_range="HEAD"
          if [[ -n "$previous_tag" ]]; then
            commit_range="$previous_tag..HEAD"
          fi
          while IFS=$'\t' read -r subject commit; do
            [[ -z "$subject" ]] && continue
            commit_type="$(printf '%s' "$subject" | sed -E 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/')"
            commit_title="$(printf '%s' "$subject" | sed -E 's/^[a-z]+(\([^)]*\))?!?:[[:space:]]*//')"
            commit_link="https://${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}/commit/$commit"
            line="- $commit_title ([${commit:0:7}]($commit_link))"
            case "$commit_type" in
              feat) printf '%s\n' "$line" >> "$features_path" ;;
              fix) printf '%s\n' "$line" >> "$fixes_path" ;;
              *) printf '%s\n' "$line" >> "$other_path" ;;
            esac
          done < <(git log --no-merges --format='%s%x09%H' "$commit_range")
          {
            echo "## What's changed"
            for category_path in "$features_path" "$fixes_path" "$other_path"; do
              case "$category_path" in
                "$features_path") category_title="Features" ;;
                "$fixes_path") category_title="Fixes" ;;
                *) category_title="Other Changes" ;;
              esac
              if [[ -s "$category_path" ]]; then
                echo
                echo "### $category_title"
                cat "$category_path"
              fi
            done
          } > "$notes_path"
          echo "path=$notes_path" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: thortools-release
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.checksum }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_NOTES_PATH: ${{ steps.notes.outputs.path }}
          RELEASE_APK_PATH: ${{ steps.apk.outputs.path }}
          RELEASE_CHECKSUM_PATH: ${{ steps.apk.outputs.checksum }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "$RELEASE_TAG"
            --notes-file "$RELEASE_NOTES_PATH"
            --fail-on-no-commits
          )
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_APK_PATH" "$RELEASE_CHECKSUM_PATH" "${release_args[@]}"
